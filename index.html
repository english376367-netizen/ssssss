<style>

input,button{font:inherit}input[type=password]{padding:12px;border:1px solid #cbd5e1;border-radius:10px;width:min(100%,300px)}
button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700;background:var(--blue);color:white}
button:disabled{cursor:not-allowed;opacity:.55}.secondary{background:#e8edfa;color:#263c73}.danger{background:#fff0f1;color:#a52032}.hidden{display:none!important}

<script>
const sections = [
{ id:"vocab2", title:"Vocabulary · Exercise 2", intro:"Choose the best answers to complete the sentences.", questions:[
["She does two jobs at the same time as she is the main ______ of the family.",["breadwinner","homemaker","housewife","bread maker"],0,"“Breadwinner” là người kiếm tiền chính để nuôi gia đình. Cụm “the main breadwinner of the family” nghĩa là trụ cột tài chính chính của gia đình.","Cô ấy làm hai công việc cùng lúc vì cô ấy là trụ cột tài chính chính của gia đình."],
["She’s such a good wife. She’s ______ her husband through difficult times.",["taught","left","supported","provided"],2,"“Support somebody through difficult times” nghĩa là hỗ trợ ai vượt qua giai đoạn khó khăn.","Cô ấy thật là một người vợ tốt. Cô ấy đã hỗ trợ chồng mình vượt qua những giai đoạn khó khăn."],
["It’s not easy for teens to get back into the school ______ after a long holiday.",["routine","bond","work","responsibility"],0,"“School routine” là nề nếp/sinh hoạt thường ngày ở trường.","Thanh thiếu niên khó quay lại nề nếp học tập ở trường sau một kỳ nghỉ dài."],
["Jim’s main ______ in his home is to keep the house clean.",["right","honour","part","responsibility"],3,"“Responsibility” nghĩa là trách nhiệm; cấu trúc “one’s responsibility is to…” nói về trách nhiệm của ai đó.","Trách nhiệm chính của Jim ở nhà là giữ cho ngôi nhà sạch sẽ."],
["Family ______ are important because they teach children what is right or wrong in life.",["bonds","values","holidays","connections"],1,"“Family values” là các giá trị/chuẩn mực gia đình truyền dạy cho trẻ.","Các giá trị gia đình rất quan trọng vì chúng dạy trẻ điều gì đúng hoặc sai trong cuộc sống."],
["Doing housework brings great ______ to children as it helps them develop necessary life skills.",["benefits","hard work","results","practices"],0,"“Bring benefits to somebody” nghĩa là mang lại lợi ích cho ai.","Làm việc nhà mang lại nhiều lợi ích cho trẻ vì giúp các em phát triển những kỹ năng sống cần thiết."],
["He’s a man of strong ______. He always fights for what is right and you can rely on him.",["health","character","hands","influence"],1,"“A man of strong character” chỉ người có tính cách vững vàng, đáng tin cậy.","Anh ấy là người có nhân cách mạnh mẽ. Anh ấy luôn đấu tranh cho điều đúng đắn và bạn có thể tin cậy anh ấy."],
["When all members of the family share housework, the family ______ will become stronger.",["joys","happiness","life","bonds"],3,"“Family bonds” nghĩa là sự gắn kết/tình cảm gia đình.","Khi tất cả thành viên trong gia đình chia sẻ việc nhà, tình cảm gia đình sẽ trở nên bền chặt hơn."],
["In many modern families, household chores are no longer divided by gender, but are shared by ______.",["obligation","agreement","permission","condition"],1,"“By agreement” nghĩa là theo sự thỏa thuận.","Trong nhiều gia đình hiện đại, việc nhà không còn được phân chia theo giới tính mà được chia sẻ theo sự thỏa thuận."],
["In many cultures, children are taught to show ______ to their parents and grandparents by speaking politely and listening carefully to their advice.",["respect","obedience","fear","support"],0,"“Show respect to somebody” nghĩa là thể hiện sự tôn trọng đối với ai.","Ở nhiều nền văn hóa, trẻ em được dạy thể hiện sự tôn trọng với cha mẹ và ông bà bằng cách nói năng lễ phép và chăm chú lắng nghe lời khuyên của họ."]
]},
{ id:"vocab3", title:"Vocabulary · Exercise 3", intro:"Complete each sentence by choosing the best word or phrase.", questions:[
["Doing chores as a family will help strengthen ______.",["life skills","respect","family bonds","support"],2,"Sau động từ “strengthen” cần một cụm danh từ làm tân ngữ. “Family bonds” là sự gắn kết gia đình.","Cùng nhau làm việc nhà sẽ giúp tăng cường tình cảm gia đình."],
["Learning to prepare and cook meals are some of the essential ______ for teens.",["life skills","family values","supportive","honest"],0,"“Life skills” là kỹ năng sống; việc chuẩn bị và nấu ăn là những kỹ năng cần thiết.","Học cách chuẩn bị và nấu các bữa ăn là một số kỹ năng sống thiết yếu đối với thanh thiếu niên."],
["Instead of giving me answers to questions, my parents always ______ me to think for myself.",["support","encourage","respect","honest"],1,"Cấu trúc “encourage somebody to do something” nghĩa là khuyến khích ai làm gì.","Thay vì đưa cho tôi câu trả lời, bố mẹ luôn khuyến khích tôi tự suy nghĩ."],
["The kids deeply ______ their grandfather for his great knowledge about the world.",["support","encourage","respect","supportive"],2,"“Respect somebody for something” nghĩa là kính trọng ai vì điều gì.","Bọn trẻ rất kính trọng ông của chúng vì kiến thức sâu rộng của ông về thế giới."],
["Sarah is an ______ girl. She never cheats in exams.",["support","honest","family bonds","respect"],1,"“Honest” là tính từ nghĩa là trung thực; trước danh từ “girl” cần tính từ.","Sarah là một cô bé trung thực. Cô ấy không bao giờ gian lận trong các kỳ thi."],
["His parents give him full ______ for his choice of school.",["support","supportive","encourage","life skills"],0,"“Give somebody support” nghĩa là ủng hộ/hỗ trợ ai.","Bố mẹ hoàn toàn ủng hộ lựa chọn trường học của cậu ấy."],
["Kindness and responsibility are two ______ that many parents want to teach to their children.",["family bonds","family values","supportive","honest"],1,"“Family values” là các giá trị gia đình như lòng tốt và tinh thần trách nhiệm.","Lòng tốt và tinh thần trách nhiệm là hai giá trị gia đình mà nhiều cha mẹ muốn dạy con."],
["I’m lucky to have such a(n) ______ brother who always gives me help when I need it.",["support","supportive","respect","encourage"],1,"Trước danh từ “brother” cần tính từ. “Supportive” nghĩa là luôn ủng hộ, sẵn sàng giúp đỡ.","Tôi thật may mắn khi có một người anh/em trai luôn ủng hộ và giúp đỡ tôi khi cần."],
["Regular family interactions help teenagers develop strong ______.",["family bonds","honest","support","encourage"],0,"“Develop strong family bonds” nghĩa là xây dựng sự gắn kết gia đình bền chặt.","Những tương tác thường xuyên trong gia đình giúp thanh thiếu niên xây dựng tình cảm gia đình bền chặt."],
["When parents listen to their children's opinions and respect their decisions, they create a(n) ______ environment for personal growth.",["honest","support","supportive","life skills"],2,"“Supportive environment” là môi trường có sự hỗ trợ, khuyến khích.","Khi cha mẹ lắng nghe ý kiến và tôn trọng quyết định của con, họ tạo ra một môi trường hỗ trợ cho sự phát triển cá nhân."]
]},
{ id:"grammar1", title:"Grammar · Exercise 1", intro:"Complete the sentences using the correct present simple or present continuous forms.", questions:[
["Nick and Dave (visit) ______ their parents twice a month.",["visit","are visiting","visits"],0,"“Twice a month” diễn tả thói quen lặp lại nên dùng hiện tại đơn. Chủ ngữ số nhiều nên dùng “visit”.","Nick và Dave đến thăm bố mẹ hai lần một tháng."],
["You can’t talk to my grandfather now. He (watch) ______ the evening news.",["watches","is watching","watch"],1,"“Now” cho biết hành động đang diễn ra; dùng hiện tại tiếp diễn: is + V-ing.","Bây giờ bạn không thể nói chuyện với ông tôi. Ông đang xem bản tin buổi tối."],
["The local shops (not open) ______ on Sunday.",["does not open","are not opening","do not open"],2,"Thói quen/lịch hoạt động thường lệ dùng hiện tại đơn. “Shops” số nhiều nên dùng “do not open”.","Các cửa hàng địa phương không mở cửa vào Chủ nhật."],
["Lan sometimes (meet) ______ her friends after school.",["meet","is meeting","meets"],2,"“Sometimes” là trạng từ chỉ tần suất; chủ ngữ Lan số ít nên động từ thêm -s.","Thỉnh thoảng Lan gặp bạn bè sau giờ học."],
["Be quiet! My younger brother (study) ______ for his exam.",["studies","is studying","study"],1,"Hành động đang diễn ra lúc nói dùng hiện tại tiếp diễn: is studying.","Hãy yên lặng! Em trai tôi đang ôn thi."],
["Chris (look) ______ stressed because he (look) ______ for a new job.",["looks / is looking","is looking / looks","look / looks"],0,"“Look stressed” diễn tả trạng thái/ấn tượng nên dùng hiện tại đơn; “look for a job” là hành động đang diễn ra nên dùng hiện tại tiếp diễn.","Chris trông có vẻ căng thẳng vì anh ấy đang tìm một công việc mới."],
["Anna often (walk) ______ to work, but her husband (drive) ______ her to her office this morning.",["is walking / drives","walks / is driving","walk / drive"],1,"“Often” diễn tả thói quen; “this morning” trong ngữ cảnh thay đổi tạm thời dùng hiện tại tiếp diễn.","Anna thường đi bộ đến chỗ làm, nhưng sáng nay chồng cô ấy đang chở cô đến văn phòng."],
["What ______ you (cook) ______? The food (smell) ______ so good!",["do / cook / is smelling","are / cooking / smells","are / cook / smell"],1,"Hỏi hành động đang diễn ra dùng “are you cooking”; “smell” chỉ cảm nhận/đặc tính nên dùng hiện tại đơn “smells”.","Bạn đang nấu món gì vậy? Món ăn có mùi thơm quá!"],
["We usually (divide) ______ household responsibilities equally, but at the moment my older sister (take) ______ on more chores.",["are dividing / takes","divide / is taking","divides / take"],1,"“Usually” dùng hiện tại đơn; “at the moment” dùng hiện tại tiếp diễn.","Gia đình tôi thường chia đều trách nhiệm việc nhà, nhưng lúc này chị gái tôi đang đảm nhận thêm việc nhà."],
["He (think) ______ carefully about a family budget, even though he usually (think) ______ little about money matters.",["thinks / is thinking","is thinking / thinks","think / think"],1,"“Think carefully about” là hành động đang suy nghĩ nên dùng tiếp diễn; “usually” diễn tả thói quen nên dùng hiện tại đơn.","Anh ấy đang suy nghĩ cẩn thận về ngân sách gia đình, mặc dù bình thường anh ấy ít nghĩ đến chuyện tiền bạc."]
]},
{ id:"grammar2", title:"Grammar · Exercise 2", intro:"Choose the corrected sentence. Each original sentence contains a tense error.", questions:[
["Hi, Anna! Where ______?",["do you go","are you going","will you go"],1,"Hỏi người khác đang đi đâu ngay lúc nói dùng hiện tại tiếp diễn: “Where are you going?”","Chào Anna! Bạn đang đi đâu vậy?"],
["What ______ right now?",["do you do","are you doing","will you do"],1,"“Right now” là dấu hiệu hành động đang diễn ra: are + subject + V-ing.","Bạn đang làm gì ngay lúc này?"],
["The children ______ to have a rest now.",["are wanting","want","wants"],1,"“Want” thường là động từ chỉ trạng thái nên không dùng tiếp diễn; chủ ngữ số nhiều dùng “want”.","Bọn trẻ muốn nghỉ ngơi ngay bây giờ."],
["I ______ you’re working very hard.",["am seeing","see","seeing"],1,"“See” mang nghĩa nhận thấy/hiểu là động từ chỉ trạng thái, thường dùng hiện tại đơn.","Tôi thấy bạn đang làm việc rất chăm chỉ."],
["Sometimes my dad ______ a good meal for the whole family.",["is cooking","cooks","cook"],1,"“Sometimes” chỉ tần suất, dùng hiện tại đơn; “my dad” số ít nên “cooks”.","Thỉnh thoảng bố tôi nấu một bữa ăn ngon cho cả gia đình."],
["I ______ that’s a great idea.",["am thinking","think","thinking"],1,"“Think” mang nghĩa cho rằng/đánh giá là động từ trạng thái, dùng hiện tại đơn.","Tôi nghĩ đó là một ý tưởng tuyệt vời."],
["I can’t go out with you tonight. I ______ on an important project.",["work","am working","works"],1,"Công việc đang diễn ra trong giai đoạn hiện tại dùng hiện tại tiếp diễn.","Tối nay tôi không thể đi chơi với bạn. Tôi đang làm một dự án quan trọng."],
["My uncle ______ a big house in the city centre.",["is having","has","have"],1,"“Have” chỉ sở hữu không dùng tiếp diễn; “my uncle” số ít nên dùng “has”.","Chú tôi có một ngôi nhà lớn ở trung tâm thành phố."],
["My parents ______ that sharing housework helps build strong family bonds.",["are believing","believe","believes"],1,"“Believe” là động từ chỉ trạng thái; chủ ngữ số nhiều “my parents” dùng “believe”.","Bố mẹ tôi tin rằng chia sẻ việc nhà giúp xây dựng tình cảm gia đình bền chặt."],
["Lan now ______ how important family routines are.",["is understanding","understand","understands"],2,"“Understand” là động từ chỉ trạng thái nên dùng hiện tại đơn; Lan là chủ ngữ số ít nên thêm -s.","Bây giờ Lan hiểu những nề nếp gia đình quan trọng như thế nào."]
]},
{ id:"speaking1", title:"Speaking · Exercise 1", intro:"Complete the conversations by choosing the best answer.", questions:[
["Lan: Nam, do you think family routines are necessary? Nam: Yes. ______ each family should have some routines to help build strong family bonds.",["I’m not sure that","I strongly believe that","I agree that","I hope that"],1,"Câu trả lời khẳng định mạnh mẽ “I strongly believe that…” phù hợp với “Yes” và ý kiến về sự cần thiết của nề nếp gia đình.","Lan: Nam, bạn có nghĩ nề nếp gia đình là cần thiết không? Nam: Có. Tôi thực sự tin rằng mỗi gia đình nên có một số nề nếp để giúp xây dựng tình cảm gia đình bền chặt."],
["Lan: What do you think about the British family value of being truthful and honest? Nam: ______, it’s one of the first things parents should teach their children.",["In their opinion","In a nutshell","In my own way","In my opinion"],3,"“In my opinion” nghĩa là “theo ý kiến của tôi”, dùng để nêu quan điểm cá nhân.","Lan: Bạn nghĩ gì về giá trị gia đình của người Anh là sống chân thật và trung thực? Nam: Theo ý kiến của tôi, đó là một trong những điều đầu tiên cha mẹ nên dạy con."],
["Lan: Do you think parents should help their children do their homework? Nam: Well, ______ parents should let their children do their homework by themselves so they can become independent.",["I don’t think","I wish that","I believe that","I hope that"],2,"“I believe that…” nghĩa là “Tôi tin rằng…”, phù hợp để giới thiệu quan điểm.","Lan: Bạn có nghĩ cha mẹ nên giúp con làm bài tập về nhà không? Nam: Tôi tin rằng cha mẹ nên để con tự làm bài tập để chúng trở nên tự lập."],
["Lan: Do you think teens should learn how to cook? Nam: Well, ______ they can learn it when they start their own families. As teens, they should spend all their time on study.",["I suppose that","I hope that","I doubt that","I agree that"],0,"“I suppose that…” diễn tả ý kiến/giả định tương đối nhẹ nhàng: “Tôi cho rằng…”.","Lan: Bạn có nghĩ thanh thiếu niên nên học nấu ăn không? Nam: Tôi cho rằng các em có thể học điều đó khi lập gia đình riêng. Khi còn là thiếu niên, các em nên dành toàn bộ thời gian cho việc học."]
]},
{ id:"reading1", title:"Reading · Exercise 1", intro:"Read the passage on the left and answer each question on the right.", passage:"Family time is when family members do things (1) ______. Ways of spending family time vary from taking a family (2) ______ in a nice place every year, or planning a family movie night every week, to having one (3) ______ together every day. Some families spend time together just by having regular family meetings. Family members can sit together to (4) ______ important issues and make decisions, or just have a chat. Some people may think it is (5) ______ for everyone to find time for their family. In many cases, parents as well as children have to adjust their own timetables to make (6) ______ to be with their family. Family time is important as it helps make the bonds between family members (7) ______ and creates fond memories of happy experiences.", translation:"Thời gian gia đình là khi các thành viên trong gia đình làm mọi việc cùng nhau. Cách dành thời gian bên gia đình rất đa dạng: đi nghỉ ở một nơi đẹp mỗi năm, lên kế hoạch xem phim gia đình mỗi tuần hoặc cùng ăn một bữa mỗi ngày. Một số gia đình dành thời gian bên nhau bằng cách tổ chức các buổi họp gia đình thường xuyên. Các thành viên có thể ngồi lại để thảo luận những vấn đề quan trọng và đưa ra quyết định, hoặc đơn giản là trò chuyện. Một số người có thể nghĩ rằng mọi người dễ dàng tìm thời gian cho gia đình. Trong nhiều trường hợp, cả cha mẹ và con cái đều phải điều chỉnh thời gian biểu để có thời gian ở bên gia đình. Thời gian gia đình rất quan trọng vì nó giúp tình cảm giữa các thành viên bền chặt hơn và tạo nên những kỷ niệm đẹp.", questions:[
["Blank (1): family members do things ______.",["for others","differently","together","similarly"],2,"“Do things together” là làm mọi việc cùng nhau, phù hợp với định nghĩa về thời gian gia đình.","Các thành viên trong gia đình làm mọi việc cùng nhau."],
["Blank (2): taking a family ______ in a nice place every year.",["responsibility","course","holiday","photo"],2,"Cụm tự nhiên là “take a family holiday” – đi nghỉ cùng gia đình.","Đi nghỉ cùng gia đình ở một nơi đẹp mỗi năm."],
["Blank (3): having one ______ together every day.",["meal","dinner","lunch","breakfast"],0,"“One meal together” có nghĩa là cùng ăn một bữa; đây là cách nói chung, không chỉ riêng bữa nào.","Cùng nhau ăn một bữa mỗi ngày."],
["Blank (4): sit together to ______ important issues.",["discuss","laugh at","enjoy","argue"],0,"“Discuss an issue” nghĩa là thảo luận một vấn đề.","Ngồi cùng nhau để thảo luận các vấn đề quan trọng."],
["Blank (5): it is ______ for everyone to find time for their family.",["interesting","funny","easy","hard"],2,"Theo đáp án của bài, “easy” thể hiện ý rằng việc tìm thời gian cho gia đình có thể được xem là dễ dàng.","Một số người có thể nghĩ rằng mọi người dễ dàng tìm được thời gian cho gia đình."],
["Blank (6): adjust timetables to make ______ to be with family.",["money","friends","time","excuses"],2,"Cụm “make time” nghĩa là thu xếp/dành thời gian.","Điều chỉnh thời gian biểu để có thời gian ở bên gia đình."],
["Blank (7): bonds between family members ______.",["stronger","special","weaker","natural"],0,"“Make something stronger” nghĩa là làm cho điều gì bền chặt hơn.","Giúp tình cảm giữa các thành viên trong gia đình bền chặt hơn."]
]},
{ id:"reading2", title:"Reading · Exercise 2", intro:"Read the passage and decide whether each statement is True or False.", passage:"American Family Day is celebrated across the United States on the first Sunday in August. In 1977, Governor Raul Castro suggested that the seventh of August should be American Family Day. One year later, Governor Bruce Babbitt signed the day into law as an official Arizona holiday. Unlike some other family holidays, people do not give gifts on this day. Instead, they celebrate by focusing on family relationships. People believe the best gift they can give their family is themselves. The most common activities include playing games outdoors, walking in a park, watching a movie, visiting grandparents and having a picnic. Some families take an art class together, visit a museum or try a new recipe and involve everyone in cooking.", translation:"Ngày Gia đình Hoa Kỳ được tổ chức trên khắp nước Mỹ vào Chủ nhật đầu tiên của tháng Tám. Năm 1977, Thống đốc Raul Castro đề xuất ngày 7 tháng 8 là Ngày Gia đình Hoa Kỳ. Một năm sau, Thống đốc Bruce Babbitt ký luật công nhận ngày này là ngày lễ chính thức của bang Arizona. Khác với một số ngày lễ gia đình khác, mọi người không tặng quà vào ngày này. Thay vào đó, họ kỷ niệm bằng cách tập trung vào các mối quan hệ gia đình. Mọi người tin rằng món quà tốt nhất dành cho gia đình chính là sự hiện diện của bản thân. Các hoạt động phổ biến gồm chơi trò chơi ngoài trời, đi dạo trong công viên, xem phim, thăm ông bà và đi dã ngoại. Một số gia đình cùng tham gia lớp học nghệ thuật, thăm bảo tàng hoặc thử công thức nấu ăn mới và để mọi người cùng tham gia nấu nướng.", questions:[
["Family Day became an official holiday in Arizona in 1977.",["True","False"],1,"Bài đọc nói năm 1977 mới là năm đề xuất; ngày này trở thành ngày lễ chính thức một năm sau, tức năm 1978.","Ngày Gia đình trở thành ngày lễ chính thức ở Arizona vào năm 1977. — Sai; năm chính thức là 1978."],
["American Family Day is usually on Sunday.",["True","False"],0,"Đoạn văn nêu ngày này được tổ chức vào Chủ nhật đầu tiên của tháng Tám.","Ngày Gia đình Hoa Kỳ thường diễn ra vào Chủ nhật. — Đúng."],
["People often give gifts to their family members on American Family Day.",["True","False"],1,"Bài đọc nói rõ mọi người không tặng quà vào ngày này.","Mọi người thường tặng quà cho các thành viên gia đình vào Ngày Gia đình Hoa Kỳ. — Sai."],
["On Family Day, family members often visit their friends together.",["True","False"],1,"Các hoạt động được liệt kê gồm thăm ông bà, không phải thăm bạn bè.","Vào Ngày Gia đình, các thành viên thường cùng nhau đi thăm bạn bè. — Sai."]
]}

{ id:"writing1", title:"Writing · Exercise 1", intro:"Choose the correctly completed sentence.", questions:[
["Mr Thanh / hate / do / housework / but / he still / clean / the house / once / week.",["Mr Thanh hates doing housework, but he still cleans the house once a week.","Mr Thanh hate do housework, but he still clean the house once week.","Mr Thanh is hating doing housework, but he still cleaning the house once a week."],0,"Dùng hiện tại đơn cho thói quen; “hate + V-ing”; chủ ngữ số ít dùng “hates/cleans”; “once a week” nghĩa là mỗi tuần một lần.","Anh Thành ghét làm việc nhà nhưng anh ấy vẫn dọn dẹp nhà cửa mỗi tuần một lần."],
["I / have / a holiday / my family / in Mai Chau / now. / We / spend / our summer holidays here / every year.",["I have a holiday with my family in Mai Chau now. We are spending our summer holidays here every year.","I'm having a holiday with my family in Mai Chau now. We spend our summer holidays here every year.","I am have a holiday with my family in Mai Chau now. We spends our summer holidays here every year."],1,"“Now” dùng hiện tại tiếp diễn: am having. “Every year” diễn tả thói quen nên dùng hiện tại đơn: we spend.","Hiện tôi đang đi nghỉ cùng gia đình ở Mai Châu. Chúng tôi dành kỳ nghỉ hè ở đây mỗi năm."],
["If / be / important / children / learn / some life skills / home.",["It is important for children to learn some life skills at home.","It important children learning some life skills home.","It is importance for children learn some life skills at home."],0,"Cấu trúc: “It is important for somebody to do something”.","Trẻ em học một số kỹ năng sống ở nhà là điều quan trọng."],
["Parents / have / teach/ their children / be honest and show respect to older people / an early age.",["Parents have teach their children be honest and show respect older people at early age.","Parents have to teach their children to be honest and show respect to older people from an early age.","Parents are have to teaching their children honest and respect older people early age."],1,"Cấu trúc “have to + V”, “teach somebody to do something”, “from an early age”.","Cha mẹ phải dạy con trung thực và tôn trọng người lớn tuổi ngay từ khi còn nhỏ."],
["Jane / think of / apply / another job. / She / think / her present job / be / boring.",["Jane thinks of apply for another job. She is thinking her present job boring.","Jane is thinking of applying for another job. She thinks her present job is boring.","Jane thinking of applying another job. She think her present job are boring."],1,"“Think of + V-ing”; “think” nghĩa là cho rằng dùng hiện tại đơn; “her present job is boring”.","Jane đang nghĩ đến việc ứng tuyển một công việc khác. Cô ấy nghĩ công việc hiện tại của mình thật nhàm chán."],
["Doing housework / help/ children / learn / take care / themselves.",["Doing housework help children learning take care themselves.","Doing housework helps children learn to take care of themselves.","Doing housework is help children to taking care themselves."],1,"Cụm V-ing làm chủ ngữ được xem là số ít nên dùng “helps”; “take care of themselves”.","Làm việc nhà giúp trẻ học cách tự chăm sóc bản thân."],
["Family routines / connected / children's health / academic achievement.",["Family routines are connected with children's health and academic achievement.","Family routines is connect children's health and academic achievement.","Family routines connected to children's health and academic achievement."],0,"Cấu trúc “be connected with”; chủ ngữ số nhiều dùng “are”.","Các thói quen sinh hoạt gia đình có liên quan đến sức khỏe và thành tích học tập của trẻ."],
["Children / should / learn / choose / right / kind of clothes / right occasion.",["Children should learning choose the right kind clothes at the right occasion.","Children should learn to choose the right kind of clothes for the right occasion.","Children should to learn choosing right clothes to right occasion."],1,"Sau “should” dùng động từ nguyên mẫu; “learn to choose” là học cách lựa chọn.","Trẻ em nên học cách chọn loại quần áo phù hợp cho đúng dịp."]
]},
{ id:"writing2", title:"Writing · Exercise 2", intro:"Complete the email by choosing the correct phrase for each blank. The reading passage and Vietnamese translation are on the left.", passage:"Hi Stacy,\n\nIt's good (1) ______. Yes, of course, I can help with your homework project on family in Viet Nam.\n\nYou know, family plays an important role in the life of Vietnamese people, and family bonds are usually strong. Extended families, (2) ______, are popular in Viet Nam. Three or even four generations live under one roof to take care of each other. Young people don't move out when they reach the age of 18, (3) ______ even after they get married. And it's not common for old people to live alone or in a nursing home. Household chores are shared by everyone in the family, but the husband is usually the breadwinner and (4) ______. Children are taught to show respect to their grandparents, (5) ______. Parents often spend their free time helping their children with their homework or giving them advice on behaviour. So you can see that family members in Viet Nam (6) ______.\n\nAbove is some information about Vietnamese families. I (7) ______. Good luck with your project. Write soon (8) ______.\n\nNam", translation:"Chào Stacy,\n\nThật vui khi nhận được tin từ bạn. Tất nhiên, mình có thể giúp bạn làm dự án về gia đình ở Việt Nam.\n\nGia đình đóng vai trò quan trọng trong cuộc sống của người Việt Nam và tình cảm gia đình thường bền chặt. Gia đình nhiều thế hệ, bao gồm ông bà, cha mẹ, con cái và đôi khi cả cụ, rất phổ biến ở Việt Nam. Ba hoặc bốn thế hệ sống chung dưới một mái nhà để chăm sóc lẫn nhau. Người trẻ không chuyển ra ở riêng khi đủ 18 tuổi mà vẫn sống với cha mẹ ngay cả sau khi kết hôn. Người cao tuổi ít khi sống một mình hoặc ở viện dưỡng lão. Mọi người cùng chia sẻ việc nhà, nhưng người chồng thường là trụ cột kinh tế còn người vợ làm nội trợ. Trẻ em được dạy kính trọng ông bà, lắng nghe hướng dẫn và làm theo lời khuyên. Cha mẹ thường dành thời gian rảnh giúp con làm bài tập hoặc khuyên bảo về cách cư xử. Vì vậy, các thành viên gia đình ở Việt Nam rất thân thiết và hỗ trợ lẫn nhau.\n\nTrên đây là một số thông tin về gia đình Việt Nam. Mình thực sự hy vọng những điều này hữu ích. Chúc bạn may mắn với dự án. Hãy sớm viết thư và cho mình biết mọi việc diễn ra thế nào.\n\nNam", questions:[
["Blank (1): It's good ______.",["to hear from you","and let me know how it goes","really hope this helps"],0,"“It’s good to hear from you” là cách mở đầu thư thân mật: thật vui khi nhận được tin từ bạn.","Thật vui khi nhận được tin từ bạn."],
["Blank (2): Extended families, ______, are popular in Viet Nam.",["the wife is the homemaker","which include grandparents, parents, children and sometimes great grandparents","are very close and supportive of each other"],1,"Mệnh đề quan hệ “which include…” bổ sung thông tin cho “extended families”.","Gia đình nhiều thế hệ, bao gồm ông bà, cha mẹ, con cái và đôi khi cả cụ, rất phổ biến ở Việt Nam."],
["Blank (3): Young people don't move out when they reach 18, ______ even after they get married.",["but live with their parents","listen to their instructions and follow their advice","the wife is the homemaker"],0,"“But live with their parents” nối ý tương phản: không chuyển ra ở riêng mà sống cùng cha mẹ.","Người trẻ không chuyển ra ở riêng khi đủ 18 tuổi mà vẫn sống với cha mẹ ngay cả sau khi kết hôn."],
["Blank (4): the husband is usually the breadwinner and ______.",["which include grandparents","the wife is the homemaker","to hear from you"],1,"“Breadwinner” là người kiếm tiền chính; ý song song là người vợ làm nội trợ.","Người chồng thường là trụ cột kinh tế và người vợ là nội trợ."],
["Blank (5): Children are taught to show respect to their grandparents, ______.",["listen to their instructions and follow their advice","and let me know how it goes","really hope this helps"],0,"Hai hành động song song: kính trọng ông bà, lắng nghe hướng dẫn và làm theo lời khuyên.","Trẻ em được dạy kính trọng ông bà, lắng nghe hướng dẫn và làm theo lời khuyên của ông bà."],
["Blank (6): family members in Viet Nam ______.",["are very close and supportive of each other","the wife is the homemaker","to hear from you"],0,"“Close and supportive of each other” mô tả các thành viên thân thiết và hỗ trợ lẫn nhau.","Các thành viên gia đình ở Việt Nam rất thân thiết và hỗ trợ lẫn nhau."],
["Blank (7): I ______.",["listen to their instructions","really hope this helps","which include grandparents"],1,"“I really hope this helps” là câu kết tự nhiên sau khi cung cấp thông tin.","Mình thực sự hy vọng những thông tin này hữu ích."],
["Blank (8): Write soon ______.",["and let me know how it goes","the wife is the homemaker","but live with their parents"],0,"“Write soon and let me know how it goes” nghĩa là hãy sớm viết thư và cho mình biết mọi việc diễn ra thế nào.","Hãy sớm viết thư và cho mình biết mọi việc diễn ra thế nào."]
]}

let activeId=null, states={};
const $=s=>document.querySelector(s);
function enterPractice(){
  const passwordEl=$("#password"), loginMsg=$("#loginMsg");
  if(!passwordEl || !loginMsg) return;
  if(passwordEl.value.trim()==="367"){
    $("#login").classList.add("hidden");
    $("#app").classList.remove("hidden");
    try { renderNav(); showSection(sections[0].id); }
    catch(err){
      $("#login").classList.remove("hidden");
      $("#app").classList.add("hidden");
      loginMsg.textContent="Không thể tải bài tập. Vui lòng tải lại file HTML và mở bằng trình duyệt Chrome/Edge.";
      console.error(err);
    }
  } else { loginMsg.textContent="Incorrect password. Please try again."; passwordEl.focus(); }
}
$("#loginBtn").addEventListener("click",enterPractice);
$("#password").addEventListener("keydown",e=>{if(e.key==="Enter")enterPractice()});
function renderNav(){let nav=$("#nav");nav.innerHTML="";sections.forEach(s=>{let b=document.createElement("button");b.textContent=s.title;b.dataset.id=s.id;b.onclick=()=>showSection(s.id);nav.appendChild(b)})}
function showSection(id){activeId=id;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));let s=sections.find(x=>x.id===id);if(!states[id])states[id]={index:0,answers:{},score:0};renderSection(s)}
function renderSection(s){let st=states[s.id];let root=$("#sections");root.innerHTML="";let sec=document.createElement("div");sec.className="section";let h=document.createElement("h2");h.textContent=s.title;sec.appendChild(h);let p=document.createElement("p");p.textContent=s.intro;sec.appendChild(p);let score=document.createElement("div");score.className="score";score.id="score";score.textContent=`Score: ${st.score} / ${Object.keys(st.answers).length} answered`;sec.appendChild(score);
if(s.passage){let split=document.createElement("div");split.className="split";let reading=document.createElement("div");reading.className="reading";reading.innerHTML="<h3>Reading passage</h3><p></p><div class='translation'><b>Bản dịch tiếng Việt</b><p></p></div>";reading.querySelector("p").textContent=s.passage;reading.querySelector(".translation p").textContent=s.translation;let qpanel=document.createElement("div");qpanel.className="questions";qpanel.innerHTML="<h3>Questions</h3><div id='qarea'></div>";split.append(reading,qpanel);sec.appendChild(split);renderQuestion(s,st,sec,qpanel.querySelector("#qarea"))}
else renderQuestion(s,st,sec,sec);
let ctr=document.createElement("div");ctr.className="controls";let left=document.createElement("div");left.innerHTML=`<button class="secondary" id="prev">← Previous</button> <button id="next">Next →</button>`;let right=document.createElement("div");right.innerHTML=`<button class="danger" id="reset">Reset this section</button>`;ctr.append(left,right);sec.appendChild(ctr);root.appendChild(sec);
$("#prev").disabled=st.index===0;$("#next").disabled=st.index>=s.questions.length-1;$("#prev").onclick=()=>{st.index--;renderSection(s)};$("#next").onclick=()=>{st.index++;renderSection(s)};$("#reset").onclick=()=>{if(confirm("Reset all answers and score for this section?")){states[s.id]={index:0,answers:{},score:0};renderSection(s)}}}
function renderQuestion(s,st,sec,target){let i=st.index,q=s.questions[i],answered=Object.prototype.hasOwnProperty.call(st.answers,i);let box=document.createElement("div");box.className="qbox";let progress=document.createElement("div");progress.className="tag";progress.textContent=`Question ${i+1} of ${s.questions.length}`;box.appendChild(progress);let title=document.createElement("p");title.className="qtext";title.textContent=q[0];box.appendChild(title);let opts=document.createElement("div");opts.className="options";q[1].forEach((o,j)=>{let b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+j)+". "+o;b.disabled=answered;b.onclick=()=>{if(Object.prototype.hasOwnProperty.call(st.answers,i))return;st.answers[i]=j;if(j===q[2])st.score++;renderSection(s)};if(answered&&j===q[2])b.classList.add("correct");if(answered&&j===st.answers[i]&&j!==q[2])b.classList.add("wrong");opts.appendChild(b)});box.appendChild(opts);
if(answered){let fb=document.createElement("div");fb.className="feedback "+(st.answers[i]===q[2]?"good":"bad");fb.innerHTML=`<p><b>${st.answers[i]===q[2]?"Correct! ✓":"Not quite. ✗"}</b> Correct answer: ${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}</p><p><b>Giải thích:</b> ${q[3]}</p><p><b>Nghĩa tiếng Việt cả câu:</b> ${q[4]}</p>`;box.appendChild(fb)}
target.appendChild(box)}
</script></body></html>
